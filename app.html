<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-width=1.0">
  <title>BeeMail - Premium Inbox</title>
  <link rel="icon" href="logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 400: '#60a5fa', 500: '#0b5cff', 600: '#1a56db', 900: '#1e3a8a' },
            dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-dark-900 dark:text-slate-100 h-screen overflow-hidden flex font-sans transition-colors duration-300">

  <!-- Desktop Sidebar -->
  <aside id="sidebar" class="w-64 border-r border-slate-200 dark:border-dark-700 bg-white dark:bg-dark-800 flex flex-col hidden md:flex transition-all-200 relative z-20">
    <div class="p-6 flex items-center gap-3">
      <img src="logo.png" alt="BeeMail Logo" class="h-10 w-10 object-contain drop-shadow-md">
      <span class="text-xl font-bold tracking-tight">BeeMail</span>
    </div>
    
    <div class="px-4 pb-6 border-b border-slate-100 dark:border-dark-700">
      <button id="composeBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white py-3 rounded-xl shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2 font-medium transition-all-200">
        <i class="ph ph-pencil-simple text-lg"></i>
        Compose
      </button>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" id="navCategories">
      <!-- Injected by JS -->
    </nav>

    <div class="p-4 border-t border-slate-200 dark:border-dark-700">
      <button id="themeToggleBtn" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-700 transition-all-200 font-medium">
        <i class="ph ph-moon text-xl dark:hidden"></i>
        <i class="ph ph-sun text-xl hidden dark:block text-brand-400"></i>
        <span class="dark:text-slate-200">Dark Mode</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
    
    <!-- Mobile Header / Top Bar -->
    <header class="h-16 glass border-b border-slate-200 dark:border-dark-700 flex items-center justify-between px-4 md:px-6 z-10 shrink-0">
      <!-- Mobile menu button & Back button -->
      <div class="flex items-center gap-3">
        <button id="mobileBackBtn" class="md:hidden hidden w-10 h-10 rounded-full hover:bg-slate-200 dark:hover:bg-dark-700 flex items-center justify-center transition-all-200">
          <i class="ph ph-arrow-left text-xl"></i>
        </button>
        <div class="md:hidden flex items-center gap-2" id="mobileLogo">
           <img src="logo.png" alt="BeeMail Logo" class="h-10 w-10 object-contain drop-shadow-sm">
        </div>
        <h1 id="viewTitle" class="text-xl font-semibold hidden md:block capitalize tracking-tight">Inbox</h1>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-xl px-4 md:px-8">
        <div class="relative group">
          <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-brand-500 transition-colors text-lg"></i>
          <input type="text" id="searchInput" placeholder="Search emails..." class="w-full bg-slate-100 dark:bg-dark-800 text-slate-900 dark:text-slate-100 pl-12 pr-4 py-2.5 rounded-full outline-none focus:ring-2 focus:ring-brand-500/50 transition-all-200 placeholder-slate-400 dark:placeholder-slate-500 border border-transparent focus:border-brand-500/30 focus:bg-white dark:focus:bg-dark-900 shadow-sm">
        </div>
      </div>

      <!-- User Profile & Theme (Mobile) -->
      <div class="flex items-center gap-3">
        <button id="mobileThemeBtn" class="md:hidden w-9 h-9 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 dark:hover:bg-dark-700 transition-colors">
          <i class="ph ph-moon text-xl dark:hidden"></i>
          <i class="ph ph-sun text-xl hidden dark:block text-brand-400"></i>
        </button>
        <div class="w-9 h-9 rounded-full overflow-hidden border-2 border-brand-500 cursor-pointer shadow-sm hover:scale-105 transition-transform">
          <img src="https://i.pravatar.cc/150?u=me" alt="User Avatar" class="w-full h-full object-cover">
        </div>
      </div>
    </header>

    <!-- Content Layout: Split on desktop, single view on mobile -->
    <div class="flex-1 flex overflow-hidden w-full relative">
      <!-- Email List Column -->
      <div id="emailListCol" class="w-full md:w-[350px] lg:w-[400px] border-r border-slate-200 dark:border-dark-700 flex flex-col h-full bg-white dark:bg-dark-800 shrink-0 absolute md:relative z-10 transition-transform duration-300 ease-in-out">
        
        <!-- Action bar for list view -->
        <div class="px-4 py-3 flex items-center justify-between border-b border-slate-100 dark:border-dark-700">
           <div class="flex items-center gap-2">
             <input type="checkbox" class="rounded text-brand-500 focus:ring-brand-500 cursor-pointer w-4 h-4">
             <button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1"><i class="ph ph-arrow-clockwise"></i></button>
           </div>
           <div class="text-sm text-slate-500 font-medium"><span id="emailCountDisplay">0</span> messages</div>
        </div>

        <div id="emailListContainer" class="flex-1 overflow-y-auto p-2 space-y-1 pb-24 md:pb-2">
          <!-- Injected by JS -->
        </div>
      </div>

      <!-- Email Detail Column -->
      <div id="emailDetailCol" class="w-full md:flex-1 h-full bg-slate-50 dark:bg-dark-900 absolute md:relative z-20 md:z-0 translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div id="emailDetailContent" class="absolute inset-0 overflow-y-auto w-full h-full">
          <!-- Injected by JS -->
          <div class="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-500 hidden md:flex">
            <div class="w-24 h-24 rounded-full bg-slate-100 dark:bg-dark-800 flex items-center justify-center mb-6">
              <i class="ph ph-envelope-open text-4xl text-slate-300 dark:text-slate-600"></i>
            </div>
            <p class="text-xl font-medium text-slate-500 dark:text-slate-400">Select an email to read</p>
            <p class="text-sm mt-2 text-slate-400 dark:text-slate-500">Nothing is selected currently.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 h-16 glass border-t border-slate-200 dark:border-dark-700 flex justify-around items-center px-2 z-30 pb-safe">
    <button class="nav-item-mobile flex flex-col items-center text-brand-500 p-2 w-16" data-cat="inbox">
      <i class="ph-fill ph-tray text-2xl"></i>
      <span class="text-[10px] font-medium mt-1">Inbox</span>
    </button>
    <button class="nav-item-mobile flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 p-2 w-16" data-cat="starred">
      <i class="ph ph-star text-2xl"></i>
      <span class="text-[10px] font-medium mt-1">Starred</span>
    </button>
    <div class="relative -top-5 w-16 flex justify-center">
      <button id="mobileComposeBtn" class="w-14 h-14 rounded-full bg-brand-500 text-white shadow-lg shadow-brand-500/40 flex items-center justify-center hover:bg-brand-600 hover:scale-105 active:scale-95 transition-all">
        <i class="ph ph-pencil-simple text-2xl"></i>
      </button>
    </div>
    <button class="nav-item-mobile flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 p-2 w-16" data-cat="sent">
      <i class="ph ph-paper-plane-right text-2xl"></i>
      <span class="text-[10px] font-medium mt-1">Sent</span>
    </button>
    <button class="nav-item-mobile flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 p-2 w-16" data-cat="trash">
      <i class="ph ph-trash text-2xl"></i>
      <span class="text-[10px] font-medium mt-1">Trash</span>
    </button>
  </nav>

  <!-- Compose Modal Overlay -->
  <div id="composeModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-300">
    <!-- Modal Content -->
    <div id="composeModalContent" class="bg-white dark:bg-dark-800 w-full sm:w-[600px] sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col transform translate-y-full sm:scale-95 transition-all duration-300 h-[85vh] sm:h-auto sm:max-h-[85vh]">
      <!-- Header -->
      <div class="px-6 py-4 border-b border-slate-200 dark:border-dark-700 flex justify-between items-center bg-slate-50 dark:bg-dark-800">
        <div class="flex items-center gap-2 text-slate-800 dark:text-white font-semibold">
          <i class="ph ph-envelope-simple text-xl text-brand-500"></i>
          New Message
        </div>
        <button id="closeComposeBtn" class="text-slate-400 hover:text-slate-800 dark:hover:text-white transition-colors bg-slate-200/50 dark:bg-dark-700 w-8 h-8 rounded-full flex items-center justify-center">
          <i class="ph ph-x text-lg"></i>
        </button>
      </div>
      <!-- Form -->
      <div class="flex-1 overflow-y-auto p-6 space-y-5">
        <div class="flex items-center border-b border-slate-200 dark:border-dark-700 pb-3 focus-within:border-brand-500 transition-colors group">
          <span class="text-slate-400 w-12 font-medium group-focus-within:text-brand-500">To:</span>
          <input type="email" id="composeTo" class="flex-1 bg-transparent outline-none text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 font-medium">
        </div>
        <div class="flex items-center border-b border-slate-200 dark:border-dark-700 pb-3 focus-within:border-brand-500 transition-colors group">
           <span class="text-slate-400 w-12 font-medium group-focus-within:text-brand-500">Cc:</span>
           <input type="email" class="flex-1 bg-transparent outline-none text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 font-medium">
        </div>
        <div class="flex items-center border-b border-slate-200 dark:border-dark-700 pb-3 focus-within:border-brand-500 transition-colors group">
          <span class="text-slate-400 w-12 font-medium group-focus-within:text-brand-500">Sub:</span>
          <input type="text" id="composeSubject" class="flex-1 bg-transparent outline-none text-slate-900 dark:text-white font-medium" placeholder="What's this about?">
        </div>
        <div class="pt-2 h-48 sm:h-64">
          <textarea id="composeBody" placeholder="Write your message here..." class="w-full h-full bg-transparent outline-none text-slate-700 dark:text-slate-300 resize-none leading-relaxed"></textarea>
        </div>
      </div>
      <!-- Footer -->
      <div class="px-6 py-4 border-t border-slate-200 dark:border-dark-700 flex items-center justify-between bg-slate-50 dark:bg-dark-800">
        <div class="flex items-center gap-1 text-slate-400">
          <button class="p-2.5 hover:bg-slate-200 hover:text-slate-700 dark:hover:bg-dark-700 dark:hover:text-slate-200 rounded-lg transition-colors"><i class="ph ph-text-aa text-xl"></i></button>
          <button class="p-2.5 hover:bg-slate-200 hover:text-slate-700 dark:hover:bg-dark-700 dark:hover:text-slate-200 rounded-lg transition-colors"><i class="ph ph-paperclip text-xl"></i></button>
          <button class="p-2.5 hover:bg-slate-200 hover:text-slate-700 dark:hover:bg-dark-700 dark:hover:text-slate-200 rounded-lg transition-colors"><i class="ph ph-image text-xl"></i></button>
          <button class="p-2.5 hover:bg-slate-200 hover:text-slate-700 dark:hover:bg-dark-700 dark:hover:text-slate-200 rounded-lg transition-colors"><i class="ph ph-link text-xl"></i></button>
        </div>
        <button id="sendEmailBtn" class="bg-brand-500 hover:bg-brand-600 text-white px-7 py-2.5 rounded-xl font-medium shadow-lg shadow-brand-500/30 transition-all flex items-center gap-2 hover:-translate-y-0.5 active:translate-y-0">
          Send <i class="ph ph-paper-plane-right text-lg"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-24 sm:bottom-8 right-1/2 translate-x-1/2 sm:translate-x-0 sm:right-8 z-[200] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Supabase & App Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
